[project]
name = "matchcut"
version = "0.1.0"
description = "Every fan's cut: verified live match intelligence and personalised highlight films from synthetic football events."
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "packages/analytics", "services/sim", "services/league-memory", "services/renderer", "services/insights", "services/api"]

[tool.uv.sources]
matchcut-contracts = { workspace = true }
matchcut-analytics = { workspace = true }
matchcut-sim = { workspace = true }
matchcut-memory = { workspace = true }
matchcut-renderer = { workspace = true }
matchcut-insights = { workspace = true }
matchcut-api = { workspace = true }

[dependency-groups]
dev = [
  "matchcut-contracts",
  "matchcut-analytics",
  "matchcut-sim",
  "matchcut-memory",
  "matchcut-renderer",
  "matchcut-insights",
  "matchcut-api",
  "httpx>=0.28",
  "common-data-format-validator>=0.1.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "PL", "S"]
ignore = [
  "PLR0913", "PLR0917",  # physics and event helpers take many explicit arguments
  "PLR2004",             # magic numbers are named football constants in context
  "S311",                # non-crypto RNG is deliberate: seeded, reproducible simulation
  "S101",                # asserts document engine invariants (type narrowing)
  "RUF001",              # en dashes in user-facing report text are intentional
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]
"services/sim/src/matchcut_sim/engine.py" = ["PLR0912", "PLR0915"]  # decision logic reads best as one function
"services/sim/src/matchcut_sim/league.py" = ["E501"]                # club data table, one club per line
"services/sim/src/matchcut_sim/cli.py" = ["PLR0915"]                # argparse wiring: one block per command
"packages/analytics/src/matchcut_analytics/state.py" = ["PLR0912", "PLR0915"]    # one branch per event type
"packages/analytics/src/matchcut_analytics/moments.py" = ["PLR0912"]               # one branch per event type
"services/insights/src/matchcut_insights/plain.py" = ["PLR0912"]                    # one template per moment kind
"services/api/src/matchcut_api/app.py" = ["PLR0915"]                                # app factory: routes close over settings
"docs/**" = ["E501", "E741"]                                          # diagram generator: drawing coordinates

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages", "services"]
exclude = ["**/.venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["matchcut_contracts", "matchcut_analytics", "matchcut_sim", "matchcut_memory", "matchcut_renderer", "matchcut_insights", "matchcut_api"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
