[project]
name = "matchcut-contracts"
version = "0.1.0"
description = "Versioned data contracts shared by every Matchcut service."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchcut_contracts"]
