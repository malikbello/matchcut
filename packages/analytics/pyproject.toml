[project]
name = "matchcut-analytics"
version = "0.1.0"
description = "Deterministic football analytics on Matchcut contracts: xG, expected threat, live match state and moment detection."
requires-python = ">=3.12"
dependencies = ["matchcut-contracts", "numpy>=2.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchcut_analytics"]
