[project]
name = "matchcut-api"
version = "0.1.0"
description = "Matchcut API: access sessions, cue streams over Server-Sent Events, and the Studio screen."
requires-python = ">=3.12"
dependencies = [
    "matchcut-contracts",
    "matchcut-editing",
    "fastapi>=0.120",
    "uvicorn>=0.40",
    "sse-starlette>=3.0",
    "itsdangerous>=2.2",
    "limits>=5.0",
    "azure-identity>=1.26",
    "azure-storage-blob>=12.24",
    "azure-storage-queue>=12.12",
]

[project.scripts]
matchcut-api = "matchcut_api.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchcut_api"]
