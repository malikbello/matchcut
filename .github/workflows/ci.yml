name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System libraries (video encoding, Skia)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libgl1 libfontconfig1
      - name: Install (locked)
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check . --output-format github
      - name: House style (no em dashes in tracked text)
        run: |
          if git grep -n -I -P '\x{2014}' -- . ':!uv.lock'; then
            echo "::error::Em dash found. Use a colon, comma, full stop or parentheses."; exit 1
          fi
      - name: Type check
        run: uv run pyright
      - name: Contracts are in sync with schemas
        run: uv run python -m matchcut_contracts.export --check
      - name: Tests with coverage (gate 80%)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  realism-smoke:
    name: Realism smoke (2 full matches)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Simulate and report
        run: uv run matchcut-sim realism --matches 2 --out realism-smoke.md
      - uses: actions/upload-artifact@v4
        with:
          name: realism-smoke
          path: realism-smoke.md
          retention-days: 7

  studio:
    name: Studio 3D bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install (locked)
        run: npm ci --no-fund
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Bundle the show camera
        run: npm run build
      - name: Bundle is present and within budget (1 MB)
        run: test "$(stat -c %s dist/show3d.js)" -lt 1048576

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --no-hashes --no-emit-workspace --format requirements-txt > requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
